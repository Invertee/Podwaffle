name: Podwaffle
version: "5.0.0"
slug: podwaffle
description: Self-hosted, synchronised podcast listening
url: https://github.com/podwaffle/podwaffle
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 3000
panel_icon: mdi:podcast
panel_title: Podwaffle
options:
  profiles: "Sam,Guest"
  join_code: "replace-me"
  port: 3000
  feed_refresh_minutes: 22
  sync_event_retention_days: 30
  history_retention_days: 365
  artwork_cache_mb: 500
  map: ["addon_config:rw"]
  log_level: info
  cast_receiver_app_id: ""
  firebase_enabled: false
  firebase_project_id: ""
  firebase_service_account_path: /data/firebase-service-account.json
  android_release_manifest_path: /data/android-release.json
  backup_retention_count: 7
schema:
  profiles: str
  join_code: password
  port: port
  feed_refresh_minutes: int(5,1440)
  sync_event_retention_days: int(1,365)
  history_retention_days: int(1,3650)
  artwork_cache_mb: int(0,10000)
  log_level: list(debug|info|warn|error)
  cast_receiver_app_id: str?
  firebase_enabled: bool
  firebase_project_id: str?
  firebase_service_account_path: str
  android_release_manifest_path: str
  backup_retention_count: int(1,100)
ports:
  3000/tcp: null
ports_description:
  3000/tcp: Podwaffle web server (ingress is preferred)
