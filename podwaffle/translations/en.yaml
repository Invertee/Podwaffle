configuration:
  cast_progress_watchdog:
    name: Cast progress watchdog
    description: Request a fresh receiver observation when Cast progress reports stop. Requires the owning phone or browser to be reachable. Restart the add-on after changing this option.
  profiles:
    name: Profiles
    description: Comma-separated profile names.
  join_code:
    name: Join code
    description: Secret code used to enrol a new device.
network:
  3000/tcp: Podwaffle internal HTTP server
