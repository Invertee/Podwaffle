name: Validate Android push delivery and diagnostics

on:
  push:
    branches:
      - fix/android-push-diagnostics-0.4.33

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Apply integration changes
        run: python tools/apply_android_push_diagnostics.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate TypeScript and Jest
        run: |
          pnpm --filter @podwaffle/android typecheck
          pnpm --filter @podwaffle/android exec jest --runInBand
      - name: Validate native Android compilation
        run: |
          pnpm --filter @podwaffle/android exec expo prebuild --platform android --no-install
          cd apps/android/android
          ./gradlew :app:compileReleaseKotlin --no-daemon
      - name: Check patch formatting
        run: git diff --check
      - name: Commit validated fix
        run: |
          rm tools/apply_android_push_diagnostics.py
          rm .github/workflows/validate-android-push-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(android): make Home Assistant push delivery observable [skip ci]"
          git push
