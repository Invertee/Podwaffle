name: Validate analysis sidecar
on:
  push:
    paths:
      [
        "podwaffle-ad-detection/**",
        ".github/workflows/validate-ad-detection.yml",
      ]
  pull_request:
    paths:
      [
        "podwaffle-ad-detection/**",
        ".github/workflows/validate-ad-detection.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm test
        working-directory: podwaffle-ad-detection
  container:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: podwaffle-ad-detection
          platforms: ${{ matrix.platform }}
          push: false
