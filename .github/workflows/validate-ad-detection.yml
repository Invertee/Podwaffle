name: Validate integrated Podwaffle analysis
on:
  push:
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "podwaffle/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/validate-ad-detection.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "podwaffle/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/validate-ad-detection.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @podwaffle/server test:engine
      - run: pnpm --filter @podwaffle/contracts build && pnpm --filter @podwaffle/server test
  container:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: podwaffle
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            PODWAFFLE_REF=${{ github.sha }}
