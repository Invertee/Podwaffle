name: Validate web UI density

on:
  push:
    branches:
      - fix/web-ui-density

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Apply web UI refinements
        run: python tools/apply_web_ui_density.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate web
        run: |
          pnpm --filter @podwaffle/web typecheck
          pnpm --filter @podwaffle/web test
          pnpm --filter @podwaffle/web build
      - name: Check patch formatting
        run: git diff --check
      - name: Commit validated changes
        run: |
          rm tools/apply_web_ui_density.py
          rm .github/workflows/validate-web-ui-density.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(web): refine episode, queue and library density [skip ci]"
          git push
