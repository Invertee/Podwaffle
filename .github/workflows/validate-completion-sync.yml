name: Validate Android completion synchronization

on:
  push:
    branches:
      - fix/android-completion-sync-0.4.23

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply completion synchronization changes
        run: |
          cat .github/patches/finalize-completion-ordering.py.gz.b64.* \
            | base64 --decode \
            | gzip -dc \
            > /tmp/finalize-repo.py
          python /tmp/finalize-repo.py
          python - <<'PY'
          from pathlib import Path

          player_path = Path("apps/web/src/player/local-player.ts")
          player = player_path.read_text()
          remote_old = '    if (!playback.ownedByCurrentDevice) {'
          remote_new = '    if (!playback.ownedByCurrentDevice && playback.mode !== "cast") {'
          status_old = '        castStatus: playback.mode === "cast" ? "connected" : "idle",'
          status_new = '        castStatus: "idle",'
          if player.count(remote_old) != 1:
              raise SystemExit("unexpected remote playback branch shape")
          if player.count(status_old) != 1:
              raise SystemExit("unexpected remote cast status shape")
          player = player.replace(remote_old, remote_new, 1)
          player = player.replace(status_old, status_new, 1)
          player_path.write_text(player)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          changelog_old = (
              "  Android to 0.4.23 / versionCode 27 while retaining native runtime\n"
              "  0.4-native-23, and bumped the Home Assistant add-on to 5.0.23.\n"
          )
          changelog_new = (
              "  Android to 0.4.23 / versionCode 27 while retaining native runtime\n"
              "  0.4-native-23, added schema 6 for explicit completion queue cleanup,\n"
              "  and bumped the Home Assistant add-on to 5.0.23.\n"
          )
          if changelog.count(changelog_old) != 1:
              raise SystemExit("unexpected completion changelog shape")
          changelog_path.write_text(changelog.replace(changelog_old, changelog_new, 1))
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            CHANGELOG.md \
            packages/contracts/src/index.ts \
            apps/android/app.config.ts \
            apps/android/package.json \
            apps/android/src/api/client.ts \
            apps/android/src/hooks/useEpisodeActions.ts \
            apps/android/src/playback/controller.ts \
            apps/android/src/playback/offlineProgress.ts \
            apps/android/src/playback/offlineProgress.test.js \
            apps/android/src/playback/queueReconciliation.ts \
            apps/android/src/playback/queueReconciliation.test.js \
            apps/android/src/stores/auth.ts \
            apps/web/src/api/client.ts \
            apps/web/src/player/device-handoff.ts \
            apps/web/src/player/local-player.ts \
            apps/server/src/api/catalog.ts \
            apps/server/src/api/playback.ts \
            apps/server/src/podcasts/service.ts \
            apps/server/tests/integration/episode-end.test.ts \
            podwaffle/config.yaml
          git diff --check
      - run: pnpm --filter @podwaffle/contracts build
      - run: pnpm --filter @podwaffle/android typecheck
      - run: pnpm --filter @podwaffle/android exec jest --runInBand
      - run: pnpm --filter @podwaffle/web typecheck
      - run: pnpm --filter @podwaffle/web test
      - run: pnpm --filter @podwaffle/server typecheck
      - run: pnpm --filter @podwaffle/server exec vitest run tests/integration/episode-end.test.ts
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(android): make completion synchronization durable [skip ci]"
          git push origin HEAD:fix/android-completion-sync-0.4.23
