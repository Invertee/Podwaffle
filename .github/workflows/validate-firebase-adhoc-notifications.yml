name: Validate Firebase adhoc notification fix

on:
  push:
    branches:
      - fix/firebase-adhoc-notifications-0.4.32

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck Android
        run: pnpm --filter @podwaffle/android typecheck
      - name: Test Android
        run: pnpm --filter @podwaffle/android exec jest --runInBand
