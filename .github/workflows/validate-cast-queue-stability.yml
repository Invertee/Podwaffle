name: Validate Cast queue stability

on:
  push:
    branches:
      - fix/cast-queue-stability-0.4.34

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Apply Cast queue fix
        run: python tools/apply_cast_queue_stability.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Android TypeScript and Jest
        run: |
          pnpm --filter @podwaffle/android typecheck
          pnpm --filter @podwaffle/android exec jest --runInBand
      - name: Prebuild Android
        run: pnpm --filter @podwaffle/android exec expo prebuild --platform android --no-install
      - name: Validate native Cast queue code
        run: |
          cd apps/android/android
          ./gradlew :podwaffle-media:testDebugUnitTest :app:compileReleaseKotlin --no-daemon
      - name: Check patch formatting
        run: git diff --check
      - name: Commit validated fix
        run: |
          rm tools/apply_cast_queue_stability.py
          rm .github/workflows/validate-cast-queue-stability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(android): keep Cast stable across queue updates [skip ci]"
          git push
