apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.podwaffle.media'
version = '0.4.23'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir, "expo-module-gradle-plugin.gradle")
if (expoModulesCorePlugin.exists()) {
  apply from: expoModulesCorePlugin
}

android {
  namespace "com.podwaffle.media"
  compileSdkVersion 35

  defaultConfig {
    minSdkVersion 26
    targetSdkVersion 35
    versionCode 27
    versionName "0.4.23"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  lintOptions {
    abortOnError false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

  // 1.8 is the first Media3 release where CastPlayer exposes receiver device
  // volume to MediaSession/System UI instead of reporting a permanent zero.
  def media3_version = "1.8.0"
  implementation "androidx.media3:media3-exoplayer:${media3_version}"
  implementation "androidx.media3:media3-session:${media3_version}"
  implementation "androidx.media3:media3-ui:${media3_version}"
  implementation "androidx.media3:media3-common:${media3_version}"
  implementation "androidx.media3:media3-cast:${media3_version}"

  implementation "com.google.android.gms:play-services-cast-framework:21.5.0"
  implementation "androidx.mediarouter:mediarouter:1.7.0"
  implementation "androidx.appcompat:appcompat:1.7.0"

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.mockito:mockito-core:5.11.0'
}
